; PlatformIO Project Configuration File
;
; Плата: ESP32-DevKitC-32 (ESP-WROOM-32), USB-UART CH340C / CP2102

[env:esp32dev]
; Официальная platformio/espressif32 давно не обновлялась и тащит старое
; ядро Arduino-ESP32 (на базе ESP-IDF 4.x) со старым mbedTLS — из-за этого
; TLS-рукопожатие с современными edge-серверами (в т.ч. ngrok) может рваться
; с ошибкой "SSL - The connection indicated an EOF".
; pioarduino — активно поддерживаемый community-форк с актуальным ядром
; (ESP-IDF 5.x, современный mbedTLS).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino

monitor_speed = 115200
; Если порт не определяется автоматически, раскомментируй и укажи явно:
; upload_port = COM5
; monitor_port = COM5

lib_deps =
    tzapu/WiFiManager
    links2004/WebSockets